name: Release Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: pip install pyinstaller pypdf tkinterdnd2

      - name: EXE bouwen
        run: pyinstaller Samenvoeger.spec --noconfirm

      - name: Inno Setup installeren
        run: choco install innosetup --no-progress -y

      - name: Installer bouwen
        run: iscc installer/samenvoeger.iss

      - name: Installer-scripts kopiëren naar distributiemap
        run: |
          Copy-Item -Path installer\install.ps1 -Destination dist\Samenvoeger\ -Force
          Copy-Item -Path installer\uninstall.ps1 -Destination dist\Samenvoeger\ -Force

      - name: IntuneWinAppUtil downloaden
        run: curl.exe --fail -L -o IntuneWinAppUtil.exe "https://github.com/microsoft/Microsoft-Win32-Content-Prep-Tool/raw/master/IntuneWinAppUtil.exe"

      - name: .intunewin pakket bouwen
        run: |
          .\IntuneWinAppUtil.exe -c dist -s Samenvoeger_Setup.exe -o . -q
          Rename-Item -Path Samenvoeger_Setup.intunewin -NewName "Samenvoeger_${{ github.ref_name }}.intunewin"

      - name: GitHub Release aanmaken
        uses: softprops/action-gh-release@v2
        with:
          name: Samenvoeger ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            dist\Samenvoeger_Setup.exe
            Samenvoeger_${{ github.ref_name }}.intunewin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}