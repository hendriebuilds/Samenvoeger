name: Release Windows EXE

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: pip install pyinstaller pypdf tkinterdnd2

      - name: EXE bouwen
        run: pyinstaller Samenvoeger.spec --noconfirm

      - name: Installer-scripts kopiëren naar distributiemap
        run: |
          Copy-Item -Path installer\install.ps1 -Destination dist\Samenvoeger\ -Force
          Copy-Item -Path installer\uninstall.ps1 -Destination dist\Samenvoeger\ -Force

      - name: IntuneWinAppUtil downloaden
        run: |
          $downloadUrl = ((Invoke-RestMethod "https://api.github.com/repos/microsoft/Microsoft-Win32-Content-Prep-Tool/releases/latest").assets | Where-Object name -eq "IntuneWinAppUtil.exe").browser_download_url
          curl.exe --fail -L -o IntuneWinAppUtil.exe $downloadUrl

      - name: .intunewin pakket bouwen
        env:
          APP_VERSION: ${{ github.ref_name }}
        run: |
          .\IntuneWinAppUtil.exe -c dist\Samenvoeger -s install.ps1 -o . -q

      - name: Distributiemap inpakken
        run: Compress-Archive -Path dist\Samenvoeger\* -DestinationPath Samenvoeger-${{ github.ref_name }}.zip

      - name: GitHub Release aanmaken
        uses: softprops/action-gh-release@v2
        with:
          name: Samenvoeger ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          files: |
            Samenvoeger-${{ github.ref_name }}.zip
            Samenvoeger.intunewin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}