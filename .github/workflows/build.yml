name: Build Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Python 3.11 instellen
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Dependencies installeren
        run: pip install pypdf pyinstaller

      - name: EXE bouwen
        run: pyinstaller Samenvoeger.spec

      - name: Artifact uploaden
        uses: actions/upload-artifact@v4
        with:
          name: Samenvoeger-${{ github.ref_name }}
          path: dist/Samenvoeger/
